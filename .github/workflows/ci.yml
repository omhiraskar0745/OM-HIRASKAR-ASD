name: CI Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build
        run: python -c "print('Build Successful')"

      - name: Test
        run: python -c "assert 2 + 2 == 4; print('All Tests Passed')"

      - name: CI Result
        run: echo "CI Pipeline Completed Successfully"
